<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Calendar Converter</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
</head>
<body>
    <div class="main-container">
        <!-- Compact Language Toggle Button with Flag -->
<!-- Language Buttons Container -->
<!-- Language Buttons Container (Side by Side) -->
<!-- Language Buttons Container -->
        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 10px;">
            <button id="enBtn" style="padding: 4px 10px; font-size: 0.85rem; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: #fff; color: #333;">🇬🇧 English</button>
            <button id="zhBtn" style="padding: 4px 10px; font-size: 0.85rem; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: #fff; color: #333;">🇨🇳 中文</button>
            <button id="ptBtn" style="padding: 4px 10px; font-size: 0.85rem; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: #fff; color: #333;">🇧🇷 Português</button>
        </div>

        <h1 data-i18n="mainHeading">Chinese Calendar Converter</h1>

        <!-- Section 1: Lunar to Solar -->
        <div class="card">
            <h2 data-i18n="lunarToSolarHeader">Lunar ➔ Solar</h2>
            <div class="form-group">
                <label for="lunarYear" data-i18n="lunarYearLabel">Lunar Year:</label>
                <input type="number" id="lunarYear" placeholder="e.g., 2026" value="2026">
            </div>
            <div class="form-group">
                <label for="lunarMonth" data-i18n="lunarMonthLabel">Lunar Month:</label>
                <input type="number" id="lunarMonth" min="1" max="12" placeholder="1-12">
            </div>
            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" id="isLeap"> <span data-i18n="isLeapLabel">Leap Month?</span>
                </label>
            </div>
            <div class="form-group">
                <label for="lunarDay" data-i18n="lunarDayLabel">Lunar Day:</label>
                <input type="number" id="lunarDay" min="1" max="30" placeholder="1-30">
            </div>
            <button id="lunarToSolarBtn" data-i18n="lunarToSolarBtn">Convert to Solar</button>
            <div id="lunarToSolarResult" class="result-box" style="display:none; margin-top: 10px; padding: 10px; border-left: 4px solid #ccc;"></div>
        </div>

        <!-- Section 2: Solar to Lunar -->
        <div class="card">
            <h2 data-i18n="solarToLunarHeader">Solar ➔ Lunar</h2>
            <div class="form-group">
                <label for="solarYear" data-i18n="solarYearLabel">Solar Year:</label>
                <input type="number" id="solarYear" placeholder="e.g., 2026" value="2026">
            </div>
            <div class="form-group">
                <label for="solarMonth" data-i18n="solarMonthLabel">Solar Month:</label>
                <input type="number" id="solarMonth" min="1" max="12" placeholder="1-12">
            </div>
            <div class="form-group">
                <label for="solarDay" data-i18n="solarDayLabel">Solar Day:</label>
                <input type="number" id="solarDay" min="1" max="31" placeholder="1-31">
            </div>
            <button id="solarToLunarBtn" data-i18n="solarToLunarBtn">Convert to Lunar</button>
            <div id="solarToLunarResult" class="result-box" style="display:none; margin-top: 10px; padding: 10px; border-left: 4px solid #ccc;"></div>
        </div>
    </div>

    <script src="script.js?v=3.0" charset="utf-8"></script>
</body>
</html>
